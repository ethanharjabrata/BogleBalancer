[project]
name = "boglebalancer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyportfolioopt>=1.6.0",
    "pyyaml>=6.0.3",
    "quantstats>=0.0.81",
    "stable-baselines3>=2.9.0",
    "torch>=2.9.1",
    "yfinance>=1.7.0",
]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
markers = [
    "overly_specific: relies on a value that may change as market data changes",
]

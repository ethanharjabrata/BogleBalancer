timeframe:
  start_year: 2000
  end_year: 2025
inflows:
  frequency: "monthly"
  value: 1000
baseline:
  us_equities_ticker: "VTSMX"
  us_equities_weight: 0.75
  us_bonds_ticker: "VBMFX"
  us_bonds_weight: 0.25
  # The frequency at which the portfolio is rebalanced.
  # For anything that isn't daily, assumes done on the first trading day of that period
  rebalance_frequency: "daily"
  # Minimum portfolio drift at which the rebalance will happen
  rebalance_threshold: 0.05